name: Update profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  activity:
    name: Update recent activity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Generate recent activity
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const updateRecentActivity = require("./scripts/updateRecentActivity.js");
            await updateRecentActivity({ github, context, core });

      - name: Commit recent activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update recent activity"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          for attempt in 1 2 3; do
            git -c http.extraheader="AUTHORIZATION: basic $auth_header" fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            if git -c http.extraheader="AUTHORIZATION: basic $auth_header" push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
          done
          exit 1

  blog:
    name: Update latest blog posts
    needs: activity
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update blog posts
        uses: gautamkrishnar/blog-post-workflow@3ba55287c220f65b8c0bbb86a1c34a5fff1124cd # v1
        with:
          feed_list: https://blog.pepo.dev/rss.xml
          max_post_count: 5

  followers:
    name: Update top followers
    needs: blog
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate top followers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/getTopFollowers.py "$GITHUB_USER" "$GITHUB_TOKEN" README.md

      - name: Commit top followers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update top followers"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          for attempt in 1 2 3; do
            git -c http.extraheader="AUTHORIZATION: basic $auth_header" fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            if git -c http.extraheader="AUTHORIZATION: basic $auth_header" push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
          done
          exit 1

  waka:
    name: Update WakaTime metrics
    needs: followers
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Update WakaTime metrics
        uses: athul/waka-readme@370590ad8da8f54282ed92aa42b7c25ecbd5a9a6 # master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: false
          BLOCKS: ░▒▓█
          TIME_RANGE: last_30_days
          LANG_COUNT: 5
          SHOW_TIME: true
          SHOW_TOTAL: false
          IGNORED_LANGUAGES: ""
