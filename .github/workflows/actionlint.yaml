name: Validate automation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "requirements*.txt"
      - "scripts/getTopFollowers.py"
      - "scripts/test_getTopFollowers.py"
      - "scripts/updateRecentActivity.js"
      - "scripts/updateRecentActivity.test.js"
  push:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "requirements*.txt"
      - "scripts/getTopFollowers.py"
      - "scripts/test_getTopFollowers.py"
      - "scripts/updateRecentActivity.js"
      - "scripts/updateRecentActivity.test.js"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate Dependabot configuration
        run: >-
          python -c "import pathlib, yaml;
          config = yaml.safe_load(pathlib.Path('.github/dependabot.yml').read_text());
          assert config.get('version') == 2;
          assert {item.get('package-ecosystem') for item in config.get('updates', [])}
          == {'github-actions', 'pip'}"

      - name: Install actionlint
        run: GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint-bin/actionlint" -color'

      - name: Test activity updater
        run: node --test scripts/updateRecentActivity.test.js

      - name: Test follower updater
        run: python -m unittest scripts.test_getTopFollowers
