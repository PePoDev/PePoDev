name: Test scripts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/getTopFollowers.py"
      - "scripts/test_getTopFollowers.py"
      - "scripts/updateRecentActivity.js"
      - "scripts/updateRecentActivity.test.js"
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/getTopFollowers.py"
      - "scripts/test_getTopFollowers.py"
      - "scripts/updateRecentActivity.js"
      - "scripts/updateRecentActivity.test.js"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install requests==2.34.2

      - name: Test activity updater
        run: node --test scripts/updateRecentActivity.test.js

      - name: Test follower updater
        run: python -m unittest scripts.test_getTopFollowers
